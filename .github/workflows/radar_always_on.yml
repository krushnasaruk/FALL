name: ProgressOS Radar Always-On Feed

on:
  schedule:
    # Runs automatically every 2 hours on GitHub cloud even while your devices are offline
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "backend/radar_server/**"
      - ".github/workflows/radar_always_on.yml"

permissions:
  contents: write

concurrency:
  group: "radar-always-on"
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Radar SQLite observation cache
        uses: actions/cache@v4
        with:
          path: backend/radar_server/data
          key: radar-sqlite-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            radar-sqlite-${{ github.ref_name }}-

      - name: Run Radar collector and export sanitized static JSON API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.RADAR_GITHUB_TOKEN || github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
          GEMINI_DAILY_BUDGET: "120"
        run: |
          python -m backend.radar_server.export_static --collect --out /tmp/radar-dist

      - name: Run backend unit tests
        run: |
          python -m unittest discover backend/radar_server/tests -v

      - name: Publish sanitized JSON feed to radar-data branch (Always-On HTTPS CDN)
        run: |
          git config user.name "progressos-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan radar-data
          git rm -rf --ignore-unmatch .
          cp -r /tmp/radar-dist/* .
          touch .nojekyll
          git add -A
          git commit -m "radar: publish automated 2h intelligence snapshot"
          git push -f origin radar-data
