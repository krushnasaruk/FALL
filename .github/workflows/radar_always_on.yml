name: ProgressOS Radar Always-On Feed

on:
  schedule:
    # Runs automatically every 2 hours in GitHub cloud even while your devices are offline
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "backend/radar_server/**"
      - ".github/workflows/radar_always_on.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "radar-pages"
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Radar SQLite observation cache
        uses: actions/cache@v4
        with:
          path: backend/radar_server/data
          key: radar-sqlite-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            radar-sqlite-${{ github.ref_name }}-

      - name: Run Radar collector and export static JSON API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.RADAR_GITHUB_TOKEN || github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
          GEMINI_DAILY_BUDGET: "120"
        run: |
          python -m backend.radar_server.export_static --collect --out backend/radar_server/dist

      - name: Run backend unit tests
        run: |
          python -m unittest discover backend/radar_server/tests -v

      - name: Setup & Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: backend/radar_server/dist

      - name: Deploy Always-On Radar Feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

