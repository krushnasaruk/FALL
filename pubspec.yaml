name: progress_os
description: "FALL - Personal Productivity & Tech Progress OS"
publish_to: 'none'

version: 4.0.0+4

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  home_widget: ^0.6.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  http: ^1.2.2
  share_plus: ^10.0.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/companion/
    - assets/images/empty/
    - assets/images/achievements/
    - assets/images/onboarding/
    - assets/sounds/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
